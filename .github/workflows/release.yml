name: release

# Pushing a tag like v0.2.0 builds the app for Windows, macOS (universal: Intel + Apple
# Silicon in one binary), and Linux, and publishes a GitHub pre-release with every bundle
# attached. Bump the version in package.json, src-tauri/Cargo.toml, and
# src-tauri/tauri.conf.json together before tagging — tauri-action reads it from
# tauri.conf.json to name the release, and it should match the tag you push.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - name: install Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The app's OAuth client credentials (Twitch/Kick) are never committed — see
      # src-tauri/.env.example. In CI they come from repo secrets instead of a local .env.
      # Required secrets (Settings → Secrets and variables → Actions):
      #   TWITCH_CLIENT_ID, KICK_CLIENT_ID, KICK_CLIENT_SECRET
      - name: write .env from secrets
        shell: bash
        working-directory: src-tauri
        run: |
          cat > .env <<EOF
          TWITCH_CLIENT_ID=${{ secrets.TWITCH_CLIENT_ID }}
          KICK_CLIENT_ID=${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET=${{ secrets.KICK_CLIENT_SECRET }}
          EOF

      # tauri-build validates that bundle.resources (.env.enc) exists before it will even
      # compile — same chicken-and-egg as building locally the first time, see README.
      # The placeholder gets overwritten with the real encrypted file right after.
      - name: encrypt .env into .env.enc
        shell: bash
        working-directory: src-tauri
        run: |
          touch .env.enc
          cargo run --example encrypt_env

      # Pulls this tag's section out of CHANGELOG.md (## [x.y.z] ... up to the next ## [
      # heading) so the GitHub release body is the real curated notes, not a placeholder.
      # Falls back to a generic message if the tag has no matching heading yet.
      - name: extract release notes
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]") > 0) { found=1; next } }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See the assets below to download and install this version."
          fi
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SnaitySoft Polls ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
